<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎬 Media Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e0e0e0;font-family:'SF Mono','Fira Code',monospace;font-size:13px}
header{padding:16px 28px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;gap:12px}
h1{font-size:14px;font-weight:600;color:#fff;letter-spacing:.06em}
.badge{background:#111;border:1px solid #222;padding:2px 8px;border-radius:3px;color:#666;font-size:11px}
.toolbar{padding:10px 28px;border-bottom:1px solid #1a1a1a;display:flex;gap:8px;align-items:center}
input[type=text]{background:#111;border:1px solid #222;color:#e0e0e0;padding:5px 10px;border-radius:3px;font-family:inherit;font-size:12px;width:240px;outline:none}
select{background:#111;border:1px solid #222;color:#888;padding:5px 8px;border-radius:3px;font-family:inherit;font-size:12px;outline:none}
.btn{padding:5px 12px;border-radius:3px;border:1px solid #222;background:#111;color:#bbb;cursor:pointer;font-family:inherit;font-size:12px}
.btn:hover{background:#1a1a1a;color:#fff}
.btn-green{background:#0d1f0d;border-color:#1a3a1a;color:#5a9a5a}
.btn-orange{background:#1f130a;border-color:#3a2a15;color:#9a7a4a}
.btn-blue{background:#0d0d1f;border-color:#1a1a3a;color:#5a5a9a}
.btn-sm{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.stats{padding:6px 28px;border-bottom:1px solid #1a1a1a;display:flex;gap:20px}
.stat{font-size:11px;color:#555}
.sel-bar{padding:8px 28px;border-bottom:1px solid #1a1a1a;display:none;align-items:center;gap:10px;background:#0f0f1a}
.grid{padding:12px 28px;display:flex;flex-direction:column;gap:2px}
.file-row{background:#111;border:1px solid #1a1a1a;border-radius:5px;overflow:hidden;transition:border-color .1s}
.file-row:hover{border-color:#222}
.file-row.selected{border-color:#2a2a4a;background:#0f0f1a}
.file-header{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.file-name{flex:1;color:#ccc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-path{color:#3a3a3a;font-size:10px}
.tbadge{font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid}
.tok{background:#0d1a0d;border-color:#1a3a1a;color:#4a8a4a}
.twarn{background:#1a150a;border-color:#3a2a1a;color:#8a6a3a}
.terr{background:#1a0d0d;border-color:#3a1a1a;color:#8a3a3a}
.tskip{color:#333;border-color:#1a1a1a}
.tvid{background:#150d1a;border-color:#2a1a3a;color:#7a5a9a}
.panel{border-top:1px solid #1a1a1a;padding:10px 12px;display:none}
.panel.open{display:block}
.track-list{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.track-item{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0d0d0d;border-radius:3px;border:1px solid #151515}
.ti{color:#333;font-size:11px;width:18px;text-align:right}
.tc{color:#5a8abf;font-size:11px;width:48px}
.tch{color:#666;font-size:11px;width:28px}
.tl{color:#8a5abf;font-size:11px;width:36px}
.tt{color:#555;font-size:11px;flex:1}
.tdef{font-size:10px;color:#4a8a4a;padding:1px 5px;background:#0d1a0d;border-radius:2px}
.actions{display:flex;gap:6px}
.log{background:#0a0a0a;border:1px solid #151515;border-radius:3px;padding:8px;font-size:11px;color:#555;max-height:100px;overflow-y:auto;margin-top:8px;display:none;white-space:pre-wrap;line-height:1.5}
.log.open{display:block}
.lok{color:#4a8a4a}
.lerr{color:#8a3a3a}
.loading{color:#333;font-size:12px;padding:32px;text-align:center}
.progress-wrap{display:flex;align-items:center;gap:6px}
.progress-bar{width:80px;height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:#2a6a2a;border-radius:2px;transition:width .4s}
.prog-text{font-size:10px;color:#666;white-space:nowrap;min-width:60px}
input[type=checkbox]{accent-color:#4a6a9a;width:13px;height:13px}
#scan-bar{position:fixed;top:0;left:0;right:0;height:6px;z-index:200;overflow:hidden;pointer-events:none;background:#111}
#scan-bar-fill{height:100%;width:0%;background:#4a8a4a;transition:width .3s;border-radius:0 3px 3px 0}
#scan-bar.active #scan-bar-fill{animation:scan-slide 1.4s infinite ease-in-out}
@keyframes scan-slide{0%{width:0%;margin-left:0%}50%{width:55%;margin-left:22%}100%{width:0%;margin-left:100%}}
#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
.toast{padding:10px 16px;border-radius:4px;font-size:12px;border:1px solid;min-width:200px;max-width:340px;pointer-events:auto;line-height:1.5;opacity:0;transform:translateX(12px);transition:opacity .2s,transform .2s;word-break:break-word}
.toast.show{opacity:1;transform:translateX(0)}
.toast-ok{background:#0d1a0d;border-color:#1a3a1a;color:#5a9a5a}
.toast-err{background:#1a0d0d;border-color:#3a1a1a;color:#9a4a4a}
.toast-info{background:#0d0d1a;border-color:#1a1a3a;color:#5a5a9a}
#cpu-widget{position:fixed;bottom:20px;left:20px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;padding:12px 14px;z-index:100;width:220px;font-size:12px}
#cpu-canvas{display:block;margin-top:6px;border-radius:3px}
@media(max-width:640px){
  header{padding:10px 12px;flex-wrap:wrap;gap:8px}
  .toolbar{padding:8px 12px;flex-wrap:wrap;gap:6px}
  input[type=text]{width:100%}
  select{width:100%;flex:1}
  .sel-bar{padding:8px 12px;flex-wrap:wrap}
  .stats{padding:6px 12px;flex-wrap:wrap;gap:6px 16px}
  .grid{padding:8px 10px;gap:3px}
  .file-header{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .file-name{font-size:11px;min-width:0}
  .file-path{font-size:10px}
  .progress-wrap{min-width:80px}
  .progress-bar{width:52px}
  .panel{padding:8px 10px}
  .track-item{flex-wrap:wrap;gap:4px 10px;padding:5px 6px}
  .ti{width:auto;min-width:12px}
  .tc{width:auto}
  .tch{width:auto}
  .tl{width:auto}
  .tt{width:100%;order:9;font-size:10px}
  .actions{flex-wrap:wrap}
  #cpu-widget{left:10px;bottom:10px;padding:5px 8px}
  #cpu-canvas{display:none}
  #toasts{right:10px;bottom:10px;left:10px;align-items:stretch}
  .toast{min-width:0;width:100%}
}
</style>
</head>
<body>
<div id="scan-bar"><div id="scan-bar-fill"></div></div>
<div id="toasts"></div>
<div id="cpu-widget">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="color:#333;letter-spacing:.06em">CPU</span>
    <span id="cpu-pct" style="color:#4a8a4a;font-size:13px;font-weight:600">—</span>
    <span id="cpu-jobs" style="color:#333">—</span>
  </div>
  <canvas id="cpu-canvas" width="192" height="52"></canvas>
  <div style="display:flex;justify-content:space-between;margin-top:3px;color:#2a2a2a;font-size:10px">
    <span>80%</span><span>50%</span><span id="cpu-cores"></span>
  </div>
  <div id="cpu-current" style="margin-top:5px;color:#555;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
</div>
<header>
  <h1>🎬 MEDIA MANAGER</h1>
  <span class="badge">v1.3.0</span>
  <span class="badge" id="b-total">—</span>
  <span class="badge" id="b-issues">—</span>
  <div style="flex:1"></div>
  <span id="scan-status" style="font-size:11px;color:#444;margin-right:8px"></span>
  <button class="btn btn-green" id="scan-btn" onclick="doScan()">Scan library</button>
</header>
<div class="toolbar">
  <input type="text" id="search" placeholder="Search..." oninput="doFilter()">
  <select id="ftype" onchange="doFilter()">
    <option value="all">All files</option>
    <option value="no-aac">Missing AAC 2.0</option>
    <option value="needs-fix">AAC not default</option>
    <option value="ok">OK</option>
    <option value="needs-video">Needs H.264 encode</option>
    <option value="4k">4K skipped</option>
  </select>
  <button class="btn btn-orange btn-sm" onclick="doNormalizeAll()">Normalize all issues</button>
</div>
<div class="sel-bar" id="sel-bar">
  <span id="sel-count" style="font-size:11px;color:#8a8abf"></span>
  <button class="btn btn-blue btn-sm" onclick="normalizeSelected()">Normalize selected</button>
  <button class="btn btn-sm" onclick="clearSelection()">Clear selection</button>
</div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"><div class="loading">Click Scan library to start</div></div>
<script src="/static/app.js?v=1.3.0"></script>
</body>
</html>
